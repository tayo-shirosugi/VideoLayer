name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check release version
        shell: pwsh
        run: |
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          [xml]$project = Get-Content VideoLayer.csproj -Raw
          if ($manifest.version -ne $project.Project.PropertyGroup.Version) {
            throw 'Version mismatch between manifest.json and VideoLayer.csproj.'
          }
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$($manifest.version)") {
            throw 'The release tag must match the manifest version.'
          }
          # setup-beat-saber adds build metadata to its manifest input.
          # Keep the source manifest unchanged for version checks and packaging.
          Copy-Item -LiteralPath manifest.json -Destination (Join-Path $env:RUNNER_TEMP 'videolayer-dependencies.json')
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Set up Beat Saber dependencies
        uses: nicoco007/setup-beat-saber@347a3e06cdb1e7ed7108dd8bb1d2cd9645b4ed11
        with:
          access-token: ${{ secrets.GITHUB_TOKEN }}
          manifest: ${{ runner.temp }}/videolayer-dependencies.json
          path: ${{ runner.temp }}/BeatSaberDir
      - name: Build and package
        shell: pwsh
        env:
          BEATSABER_DIR: ${{ runner.temp }}/BeatSaberDir
        run: ./build.ps1
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: VideoLayer-build
          path: dist/VideoLayer-v*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VideoLayer-build
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
          draft: false
          generate_release_notes: false
          append_body: false
          body: |
            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
